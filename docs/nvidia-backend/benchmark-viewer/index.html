<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CUDA Backend Benchmark Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">PTO CUDA backend</p>
        <h1>Benchmark Status</h1>
      </div>
      <nav aria-label="Benchmark views">
        <button type="button" class="tab active" data-view="summary">Summary</button>
        <button type="button" class="tab" data-view="benchmarks">Benchmarks</button>
        <button type="button" class="tab" data-view="methods">Methods</button>
        <button type="button" class="tab" data-view="serving">Serving Policies</button>
        <button type="button" class="tab" data-view="serving-commands">Serving Commands</button>
        <button type="button" class="tab" data-view="baselines">Baselines</button>
        <button type="button" class="tab" data-view="goal-progress">Goal Progress</button>
        <button type="button" class="tab" data-view="work-queue">Work Queue</button>
        <button type="button" class="tab" data-view="paper-evaluation">Paper Matrix</button>
        <button type="button" class="tab" data-view="results">Results</button>
      </nav>
    </header>

    <main>
      <section id="load-error" class="notice hidden"></section>

      <section id="summary" class="view active" aria-labelledby="summary-title">
        <h2 id="summary-title">Current Snapshot</h2>
        <div id="snapshot" class="snapshot-grid"></div>
        <div id="headline-results"></div>
      </section>

      <section id="benchmarks" class="view" aria-labelledby="benchmarks-title">
        <h2 id="benchmarks-title">Benchmark Setups</h2>
        <div id="benchmark-list" class="stack"></div>
      </section>

      <section id="methods" class="view" aria-labelledby="methods-title">
        <h2 id="methods-title">Methods And Runtimes</h2>
        <div id="method-list" class="stack"></div>
      </section>

      <section id="serving" class="view" aria-labelledby="serving-title">
        <h2 id="serving-title">Serving Workload Policies</h2>
        <div id="serving-list" class="stack"></div>
      </section>

      <section id="serving-commands" class="view" aria-labelledby="serving-commands-title">
        <h2 id="serving-commands-title">Serving Command Plan</h2>
        <div id="serving-command-list" class="stack"></div>
      </section>

      <section id="baselines" class="view" aria-labelledby="baselines-title">
        <h2 id="baselines-title">Paper Baseline Readiness</h2>
        <div id="baseline-list" class="stack"></div>
      </section>

      <section id="goal-progress" class="view" aria-labelledby="goal-progress-title">
        <h2 id="goal-progress-title">Goal Progress</h2>
        <div id="goal-progress-list" class="stack"></div>
      </section>

      <section id="work-queue" class="view" aria-labelledby="work-queue-title">
        <h2 id="work-queue-title">Paper Work Queue</h2>
        <div id="paper-work-queue" class="stack"></div>
      </section>

      <section id="paper-evaluation" class="view" aria-labelledby="paper-evaluation-title">
        <h2 id="paper-evaluation-title">Paper Evaluation Matrix</h2>
        <div id="paper-readiness-audit" class="stack"></div>
        <div id="paper-evaluation-list" class="stack"></div>
      </section>

      <section id="results" class="view" aria-labelledby="results-title">
        <h2 id="results-title">Selected Results</h2>
        <div id="result-table"></div>
      </section>
    </main>

    <script src="viewer.js"></script>
  </body>
</html>
